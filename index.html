<!--
Responsive AI Chat (single-file)
- Dark themed, responsive, Copilot-like layout
- Plug in your own backend by replacing `API_ENDPOINT` and `API_KEY` in the JS

Features:
- Mobile-first responsive UI
- Message bubbles, avatars, and assistant typing indicator
- Quick prompt suggestions
- Keyboard shortcut: Enter to send, Shift+Enter for newline
- Mock-mode fallback (no server) so it works offline for testing

Usage:
1. Save this file as `responsive-ai-chat.html` and open in browser.
2. To connect a real AI backend, change `API_ENDPOINT` and include an API key in fetch headers.

Author: ChatGPT for blackyodha (gaming + dark theme vibes)
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WarpX AI Chat — Responsive</title>
  <style>
    :root{
      --bg:#0b0d11;
      --panel:#0f1116;
      --muted:#9aa3b2;
      --accent:#9b59ff;
      --accent-2:#6ee7b7;
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      --max-width:980px;
      --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#07080a);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;color:#e6eef6}

    .app{
      max-width:var(--max-width);
      margin:28px auto;
      background:linear-gradient(180deg,var(--panel), rgba(20,16,24,0.85));
      border-radius:18px;
      box-shadow:0 10px 40px rgba(2,6,23,0.7);
      display:grid;
      grid-template-columns: 300px 1fr;
      min-height:72vh;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
    }

    /* Sidebar */
    .sidebar{
      padding:18px;
      border-right:1px solid rgba(255,255,255,0.03);
      background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      display:flex;flex-direction:column;gap:14px;
    }
    .brand{display:flex;gap:12px;align-items:center}
    .logo-img{
      width:46px;
      height:46px;
      border-radius:10px;
      box-shadow:0 6px 24px rgba(155,89,255,0.14);
      object-fit:cover;
    }
    .title{font-size:14px;font-weight:700}
    .subtitle{font-size:12px;color:var(--muted)}

    .conversations{flex:1;overflow:auto;padding-right:6px;}
    .conv{padding:10px;border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
    .conv:hover{background:rgba(255,255,255,0.02)}
    .conv .meta{display:flex;flex-direction:column}
    .new-chat{padding:12px;border-radius:10px;background:linear-gradient(90deg, rgba(155,89,255,0.12), rgba(111,66,255,0.06));text-align:center;font-weight:600;cursor:pointer}

    /* Main area */
    .main{display:flex;flex-direction:column;}
    .header{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid rgba(255,255,255,0.02)}
    .header .h-left{display:flex;gap:12px;align-items:center}
    .session-title{font-weight:700}
    .session-sub{color:var(--muted);font-size:13px}

    .messages{
      padding:22px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;background-image:radial-gradient(circle at 10% 10%, rgba(155,89,255,0.03), transparent 15%), radial-gradient(circle at 90% 90%, rgba(110,231,183,0.02), transparent 12%);
    }

    .msg{max-width:82%;padding:12px 16px;border-radius:12px;line-height:1.45}
    .user{align-self:flex-end;background:linear-gradient(180deg,#20222b,#121317);border:1px solid rgba(255,255,255,0.03);}
    .ai{align-self:flex-start;background:linear-gradient(180deg, rgba(155,89,255,0.08), rgba(155,89,255,0.02));border:1px solid rgba(155,89,255,0.08);color:#eaf4ff}
    .meta-row{display:flex;gap:10px;align-items:center;font-size:13px}

    .avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700}
    .avatar.user{background:#111214}
    .avatar.ai{background:linear-gradient(135deg,var(--accent), #5b31ff)}

    .input-area{padding:14px;border-top:1px solid rgba(255,255,255,0.02);display:flex;gap:12px;align-items:center}
    textarea{flex:1;min-height:46px;max-height:140px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.02);border:none;color:inherit;font-size:15px;resize:none}
    .send-btn{background:linear-gradient(90deg,var(--accent),#6b3bff);border:none;padding:12px 14px;border-radius:12px;color:white;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(107,59,255,0.12);}
    .send-btn:active{transform:translateY(1px)}

    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:8px 10px;border-radius:999px;background:var(--glass);font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,0.02)}
    .typing{display:inline-block;height:18px;width:46px}
    .dot{height:7px;width:7px;border-radius:50%;display:inline-block;margin-right:6px;opacity:0.9;animation:blink 1.25s infinite}
    .dot.d1{animation-delay:0s}
    .dot.d2{animation-delay:0.15s}
    .dot.d3{animation-delay:0.3s}
    @keyframes blink{0%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}100%{opacity:.2;transform:translateY(0)}}

    /* responsive */
    @media (max-width:880px){
      .app{grid-template-columns:1fr;min-height:80vh;margin:12px}
      .sidebar{display:flex;flex-direction:row;overflow:auto;padding:12px;gap:8px}
      .conversations{display:flex;gap:8px}
      .conv{min-width:150px}
      .header{padding:12px}
      .messages{padding:16px}
    }

    /* tiny cosmetics */
    .hint{font-size:12px;color:var(--muted)}
    .muted{color:var(--muted)}

  </style>
</head>
<body>
  <div class="app" role="application" aria-label="AI chat">
    <aside class="sidebar">
      <div class="brand">
        <img src="https://github.com/VAIX700/warpXgaming_/blob/main/favicon.png?raw=true" 
             alt="WarpX Logo" 
             class="logo-img" />
        <div>
          <div class="title">WarpX AI</div>
          <div class="subtitle">chat — fast & responsive</div>
        </div>
      </div>

      <div class="new-chat" id="newChat">+ New chat</div>

      <div class="conversations" id="conversations" aria-label="Conversations">
        <!-- conversation list (local only) -->
      </div>

      <div style="margin-top:auto">
        <div class="hint">Tip: Press <strong>Enter</strong> to send, <em>Shift+Enter</em> for newline</div>
        <div style="height:12px"></div>
        <div class="muted">Local mock-mode active — replace API_ENDPOINT in script to connect to real AI.</div>
      </div>
    </aside>

    <main class="main">
      <div class="header">
        <div class="h-left">
          <div class="session-title" id="sessionTitle">New conversation</div>
          <div class="session-sub" id="sessionSub">Your personal AI — responsive & sleek</div>
        </div>
        <div class="controls">
          <button id="clearBtn" class="chip">Clear</button>
        </div>
      </div>

      <div class="messages" id="messages" tabindex="0" aria-live="polite"></div>

      <div class="input-area">
        <div style="width:44px;display:grid;place-items:center"><div class="avatar user">V</div></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:10px">
          <div class="chips" id="chips">
            <div class="chip">Summarize</div>
            <div class="chip">Make it shorter</div>
            <div class="chip">Write a tweet</div>
            <div class="chip">Explain like I'm 5</div>
          </div>
          <textarea id="input" placeholder="Ask anything — coding, game ideas, drums, music..." aria-label="Message input"></textarea>
        </div>
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </main>
  </div>

  <script>
    // ====== CONFIG ======
    const API_ENDPOINT = null; // Replace with your server endpoint
    const API_KEY = null;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChat');
    const conversationsEl = document.getElementById('conversations');
    const sessionTitle = document.getElementById('sessionTitle');
    const clearBtn = document.getElementById('clearBtn');
    const chipsEl = document.getElementById('chips');

    let sessions = JSON.parse(localStorage.getItem('wx_sessions') || '[]');
    let currentSession = { id: Date.now().toString(), title: 'New conversation', messages: [] };

    function saveSessions(){ localStorage.setItem('wx_sessions', JSON.stringify(sessions)); }
    function renderConversations(){
      conversationsEl.innerHTML='';
      sessions.forEach(s=>{
        const el=document.createElement('div'); el.className='conv'; el.tabIndex=0;
        el.innerHTML=`<div style="width:40px"><div class="avatar" style="background:linear-gradient(135deg,#6ee7b7,#00b894)">${s.title[0]||'C'}</div></div>
        <div class="meta"><div style="font-weight:700">${s.title}</div><div class="muted" style="font-size:12px">${s.messages?.slice(-1)[0]?.content?.slice(0,42)||'Start chatting...'}</div></div>`;
        el.onclick=()=>{openSession(s.id)};
        conversationsEl.appendChild(el);
      });
    }
    function openSession(id){ const s=sessions.find(x=>x.id===id); if(!s)return; currentSession=s; sessionTitle.textContent=s.title||'Conversation'; renderMessages();}
    function newSession(){ const s={id:Date.now().toString(),title:'New conversation',messages:[]}; sessions.unshift(s); currentSession=s; saveSessions(); renderConversations(); renderMessages();}
    newChatBtn.onclick=()=>newSession();
    clearBtn.onclick=()=>{if(confirm('Clear current chat?')){currentSession.messages=[]; renderMessages(); saveSessions();}}

    function renderMessages(){ messagesEl.innerHTML=''; (currentSession.messages||[]).forEach(m=>appendMessageToDOM(m)); scrollToBottom();}
    function appendMessageToDOM(msg){
      const wrap=document.createElement('div'); const bubble=document.createElement('div');
      bubble.className='msg '+(msg.role==='user'?'user':'ai');
      if(msg.role==='ai'){
        wrap.style.alignSelf='flex-start';
        wrap.innerHTML=`<div class='meta-row'><div class='avatar ai'>AI</div><div style='display:flex;flex-direction:column'><strong style='font-size:13px'>WarpX AI</strong><span class='muted' style='font-size:12px'>assistant</span></div></div>`;
        bubble.innerHTML=msg.content; wrap.appendChild(bubble);
      } else { wrap.style.alignSelf='flex-end'; bubble.innerHTML=msg.content.replace(/\n/g,'<br>'); wrap.appendChild(bubble);}
      messagesEl.appendChild(wrap);
    }
    function scrollToBottom(){ requestAnimationFrame(()=>{ messagesEl.scrollTop=messagesEl.scrollHeight; }); }

    let typingEl=null;
    function showTyping(){ typingEl=document.createElement('div'); typingEl.className='msg ai'; typingEl.style.display='inline-block';
      typingEl.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div class='avatar ai'>AI</div><div class='typing'><span class='dot d1'></span><span class='dot d2'></span><span class='dot d3'></span></div></div>`;
      messagesEl.appendChild(typingEl); scrollToBottom();}
    function hideTyping(){ if(typingEl){typingEl.remove(); typingEl=null;}}

    async function sendMessage(){
      const text=inputEl.value.trim(); if(!text)return;
      const userMsg={role:'user',content:text,ts:Date.now()}; currentSession.messages.push(userMsg); appendMessageToDOM(userMsg);
      inputEl.value=''; saveSessions(); scrollToBottom();
      showTyping();
      try{ const aiText=await callAI(text,currentSession.messages); hideTyping(); const aiMsg={role:'assistant',content:aiText,ts:Date.now()}; currentSession.messages.push(aiMsg); appendMessageToDOM(aiMsg); saveSessions(); scrollToBottom();}
      catch(err){ hideTyping(); const errMsg={role:'assistant',content:'Error: '+(err.message||err),ts:Date.now()}; currentSession.messages.push(errMsg); appendMessageToDOM(errMsg); saveSessions();}
    }

    async function callAI(prompt,history){
      if(!API_ENDPOINT){ await new Promise(r=>setTimeout(r,700+Math.random()*700)); return mockReply(prompt);}
      const res=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,history})});
      if(!res.ok)throw new Error('Network error: '+res.status); const data=await res.json(); return data.reply||data.output||JSON.stringify(data);
    }

    function mockReply(prompt){ const replies=[`Nice ask — here's a quick idea: ${shorten(prompt,100)}`,`I got you. TL;DR: ${shorten(prompt,80)}`,`On it — consider this: ${shorten(prompt,110)}`,`That reminds me: break it into steps and prototype fast.`]; return replies[Math.floor(Math.random()*replies.length)]; }
    function shorten(s,n){ if(s.length<=n)return s; return s.slice(0,n-1)+'…'; }

    sendBtn.onclick=sendMessage;
    inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); sendMessage();}});
    chipsEl.addEventListener('click',e=>{const t=e.target;if(t.classList.contains('chip')){inputEl.value=t.textContent+(inputEl.value?('\n'+inputEl.value):''); inputEl.focus();}});
    sessionTitle.addEventListener('click',()=>{const newTitle=prompt('Rename conversation',sessionTitle.textContent); if(newTitle!==null){sessionTitle.textContent=newTitle; currentSession.title=newTitle; sessions=sessions.filter(s=>s.id!==currentSession.id); sessions.unshift(currentSession); saveSessions(); renderConversations();}});
    window.addEventListener('beforeunload',()=>{saveSessions();});

    if(sessions.length===0){sessions.push(currentSession);} else{currentSession=sessions[0];}
    renderConversations(); renderMessages();
  </script>
</body>
</html>
